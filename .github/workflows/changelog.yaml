name: Update Changelog

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  fetch-changelog:
    name: Update Changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set HTML File Path
        run: |
          HTML_FILE="changelog.html"
          echo "HTML_FILE=$HTML_FILE" >> $GITHUB_ENV

      - name: Verify HTML File Exists
        run: |
          if [ ! -f "$HTML_FILE" ]; then
            echo "HTML file not found: $HTML_FILE"
            exit 1
          fi

          echo "HTML file found:"
          ls -l "$HTML_FILE"

      - name: Download Translations Artifact
        uses: actions/download-artifact@v4
        with:
          name: translations
          path: ./translations_temp
        continue-on-error: true

      - name: Unzip Translations Artifact
        run: |
          if [ -d "./translations_temp" ]; then
            mkdir -p translations
            # Search for zip file inside download directory and unzip
            ZIP_FILE=$(find ./translations_temp -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Unzipping $ZIP_FILE..."
              unzip -o "$ZIP_FILE" -d translations/
            else
              echo "No zip file found inside translations_temp, copying contents..."
              cp -r ./translations_temp/* translations/
            fi
          else
            echo "No translations artifact found."
          fi
          
      - name: Extract Translations Version
        id: fetch_translation
        run: |
          # Find all strings.xml inside translations/values* directories
          XML_FILE=$(find translations -path "*/values*/strings.xml" 2>/dev/null | head -n 1)

          if [ -z "$XML_FILE" ]; then
            echo "No strings.xml found under translations/values*"
            TRANSLATION_VERSION="Unknown"
          else
            # Extract text inside <string name="text_tool_version">...</string>
            TRANSLATION_VERSION=$(grep -oP '(?<=<string name="text_tool_version">).*(?=</string>)' "$XML_FILE" | head -n 1)
          fi

          if [ -z "$TRANSLATION_VERSION" ]; then
            TRANSLATION_VERSION="Unknown"
          fi

          echo "Extracted Translation Version: $TRANSLATION_VERSION"
          echo "translations=$TRANSLATION_VERSION" >> $GITHUB_OUTPUT
          
      - name: Update App Version
        run: |
          APP_VERSION="dummy1"
          TRANSLATIONS="${{ steps.fetch_translation.outputs.translations }}"
          CHANGELOG_FILE="CHANGELOG.md"

          EXISTING_APP_VERSION=$(grep -oP '(?<=<li>App Version - ).*(?=</li>)' "$HTML_FILE")
          echo "EXISTING_APP_VERSION=$EXISTING_APP_VERSION" >> $GITHUB_ENV
          echo "Existing App Version: $EXISTING_APP_VERSION"

          # Rename current HEAD section to existing app version
          sed -i "s|<h2 id=\"_HEAD\">Release HEAD</h2>|<h2 id=\"_$EXISTING_APP_VERSION\">Release $EXISTING_APP_VERSION</h2>|" "$HTML_FILE"

          # Add Release HEAD header back at the top
          sed -i "/<h2 id=\"_$EXISTING_APP_VERSION\">Release $EXISTING_APP_VERSION<\/h2>/i\\      <h2 id=\"_HEAD\">Release HEAD<\/h2>" "$HTML_FILE"

          # Add version pointer in TOC
          sed -i "/<li><a href=\"#_HEAD\">Release HEAD<\/a><\/li>/a\\        <li><a href=\"#_$EXISTING_APP_VERSION\">Release $EXISTING_APP_VERSION<\/a><\/li>" "$HTML_FILE"

          # Update latest app version
          sed -i "s|<li>App Version - .*</li>|<li>App Version - $APP_VERSION</li>|" "$HTML_FILE"

          # Update translations
          sed -i "s|<li>Translations: .*</li>|<li>Translations: $TRANSLATIONS</li>|" "$HTML_FILE"

          # Execute Python script
          export CHANGELOG_FILE="$CHANGELOG_FILE"
          python3 generate_head.py

          # Insert generated tables under Release HEAD
          sed -i "/<h2 id=\"_HEAD\">Release HEAD<\/h2>/r release_head.html" "$HTML_FILE"

      - name: Upload Changelog Artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: ${{ env.HTML_FILE }}
